<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="uiltje" aria-hidden="true" focusable="false">
  <!-- Uiltje : mascotte originale de Woordjes. Les classes servent aux animations CSS (voir global.css). -->
  <g class="stars" fill="#FFB703">
    <path class="star s1" d="M28 44l4.2 8.6 9.5 1.4-6.9 6.7 1.6 9.4L28 65.7l-8.4 4.4 1.6-9.4-6.9-6.7 9.5-1.4z"/>
    <path class="star s2" d="M170 30l3.4 6.9 7.6 1.1-5.5 5.4 1.3 7.6-6.8-3.6-6.8 3.6 1.3-7.6-5.5-5.4 7.6-1.1z"/>
    <path class="star s3" d="M160 92l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>
  </g>
  <g class="owl">
    <!-- aigrettes -->
    <path d="M58 82 46 30l40 20z" fill="#6C4AB6"/>
    <path d="M142 82l12-52-40 20z" fill="#6C4AB6"/>
    <!-- pattes -->
    <g fill="#FFB703">
      <path d="M70 180h26l-4 10h-8l-3 8-3-8h-8z"/>
      <path d="M104 180h26l-4 10h-8l-3 8-3-8h-8z"/>
    </g>
    <!-- corps -->
    <ellipse cx="100" cy="116" rx="64" ry="72" fill="#6C4AB6"/>
    <!-- ventre -->
    <ellipse cx="100" cy="136" rx="42" ry="46" fill="#FFF1D6"/>
    <g fill="none" stroke="#F0CF8E" stroke-width="3" stroke-linecap="round">
      <path d="M78 134q6 9 12 0M90 134q6 9 12 0M102 134q6 9 12 0M114 134q6 9 12 0"/>
      <path d="M84 150q6 9 12 0M96 150q6 9 12 0M108 150q6 9 12 0"/>
      <path d="M90 166q6 9 12 0M102 166q6 9 12 0"/>
    </g>
    <!-- ailes -->
    <ellipse class="wing wing-l" cx="44" cy="126" rx="15" ry="40" fill="#55389A"/>
    <ellipse class="wing wing-r" cx="156" cy="126" rx="15" ry="40" fill="#55389A"/>
    <!-- masque facial -->
    <path d="M50 94c0-26 22-46 50-46s50 20 50 46c0 20-22 36-50 36S50 114 50 94z" fill="#8A6CD1"/>
    <!-- joues -->
    <circle cx="58" cy="110" r="7" fill="#FF8FA3" opacity=".75"/>
    <circle cx="142" cy="110" r="7" fill="#FF8FA3" opacity=".75"/>
    <!-- yeux -->
    <g class="eye eye-l">
      <circle cx="74" cy="92" r="22" fill="#fff"/>
      <g class="pupil">
        <circle cx="77" cy="94" r="12" fill="#2EC4B6"/>
        <circle cx="78" cy="95" r="7" fill="#2B2D42"/>
        <circle cx="81" cy="90" r="3" fill="#fff"/>
      </g>
    </g>
    <g class="eye eye-r">
      <circle cx="126" cy="92" r="22" fill="#fff"/>
      <g class="pupil">
        <circle cx="123" cy="94" r="12" fill="#2EC4B6"/>
        <circle cx="122" cy="95" r="7" fill="#2B2D42"/>
        <circle cx="125" cy="90" r="3" fill="#fff"/>
      </g>
    </g>
    <!-- bec -->
    <path d="M100 104l-9 7 9 15 9-15z" fill="#FFB703"/>
  </g>
</svg>
